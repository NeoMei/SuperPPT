{
  "name": "Release",
  "on": {
    "push": { "tags": ["v*"] }
  },
  "permissions": {
    "contents": "write",
    "id-token": "write",
    "attestations": "write",
    "artifact-metadata": "write"
  },
  "jobs": {
    "release": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        { "uses": "actions/checkout@v4", "with": { "fetch-depth": 0 } },
        {
          "uses": "actions/setup-node@v4",
          "with": { "node-version": "22.6.0", "cache": "npm" }
        },
        { "run": "npm ci" },
        { "run": "npm run verify:portable" },
        { "run": "npm run test:release-install" },
        {
          "name": "Verify tag and main ancestry",
          "run": "git fetch origin main\ngit merge-base --is-ancestor \"$GITHUB_SHA\" origin/main\nnpm run release:check -- --root \"$GITHUB_WORKSPACE\" --tag \"$GITHUB_REF_NAME\""
        },
        {
          "name": "Build checksummed plugin archive",
          "run": "mkdir -p release-artifacts\nnpm pack --pack-destination release-artifacts\n(cd release-artifacts && sha256sum *.tgz > SHA256SUMS)"
        },
        {
          "name": "Attest release artifacts",
          "uses": "actions/attest@v4",
          "with": { "subject-path": "release-artifacts/*" }
        },
        {
          "name": "Publish immutable GitHub Release",
          "env": { "GH_TOKEN": "${{ github.token }}" },
          "run": "gh release create \"$GITHUB_REF_NAME\" release-artifacts/* --verify-tag --generate-notes --title \"SuperPPT $GITHUB_REF_NAME\""
        }
      ]
    }
  }
}
